<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.4"/>
        </filter>
        <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff"/>
            <stop offset="50%" stop-color="#ccc"/>
            <stop offset="100%" stop-color="#888"/>
        </linearGradient>
    </defs>
    
    <g filter="url(#shadow)" transform="translate(20, 0)">
        
        <!-- Back Arm -->
        <g id="back_arm" transform="translate(200, 130) rotate(-40) translate(-200, -130)">
            <path d="M 200 130 C 220 135, 225 160, 215 180 C 205 185, 195 185, 185 175 C 180 150, 185 130, 200 130 Z" fill="#37474F"/>
            <!-- Lower Arm & Shield -->
            <g id="back_lower" transform="translate(200, 175) rotate(0) translate(-200, -175)">
                <path d="M 195 170 C 220 190, 225 210, 215 220 C 205 225, 195 220, 185 200 Z" fill="#37474F"/>
                <circle cx="205" cy="220" r="12" fill="#37474F"/>
                <g id="shield" transform="translate(205, 215) rotate(-15)">
                    <ellipse cx="0" cy="0" rx="40" ry="25" fill="#212121" stroke="#607D8B" stroke-width="4"/>
                    <ellipse cx="0" cy="0" rx="8" ry="5" fill="#DAA520"/>
                    <circle cx="-20" cy="0" r="3" fill="#DAA520"/>
                    <circle cx="20" cy="0" r="3" fill="#DAA520"/>
                    <circle cx="0" cy="-12" r="3" fill="#DAA520"/>
                    <circle cx="0" cy="12" r="3" fill="#DAA520"/>
                </g>
            </g>
        </g>
        
        <!-- Back Leg -->
        <g id="back_leg" transform="translate(190, 230) rotate(-20) translate(-190, -230)">
            <path d="M 190 230 C 210 230, 230 260, 215 290 L 195 290 C 180 260, 180 240, 190 230 Z" fill="#C4C1B3"/>
            <path d="M 195 285 L 215 285 L 215 290 L 195 290 Z" fill="#B38C1B"/>
            <g id="back_lower_leg" transform="translate(205, 285) rotate(0) translate(-205, -285)">
                <path d="M 205 285 C 220 310, 215 340, 205 360 C 195 360, 185 340, 190 310 Z" fill="#37474F"/>
                <path d="M 200 355 C 220 355, 230 365, 225 375 L 190 375 C 185 365, 190 355, 200 355 Z" fill="#37474F"/>
            </g>
        </g>

        <!-- Torso & Core -->
        <g id="torso" transform="translate(195, 240) rotate(25) translate(-195, -240)">
            <path d="M 185 125 C 215 120, 230 140, 225 180 C 220 210, 215 235, 195 240 C 175 240, 165 210, 165 180 C 160 140, 175 125, 185 125 Z" fill="#263238"/>
            <path d="M 175 145 C 195 150, 215 150, 225 140 C 215 155, 195 155, 175 150 Z" fill="#3A2212" opacity="0.5"/>
            <path d="M 195 160 L 195 210 M 185 175 L 205 175 M 185 190 L 205 190" stroke="#3A2212" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
            <path d="M 165 220 C 190 230, 215 230, 225 215 C 220 235, 190 250, 170 240 Z" fill="#FFD54F"/>
            <path d="M 170 230 C 160 250, 155 270, 165 280 C 170 270, 175 250, 175 230 Z" fill="#FFD54F"/>
            
            <!-- Head -->
            <g id="head" transform="translate(190, 125) rotate(10) translate(-190, -125)">

                <!-- Vikram Pagdi/Helmet -->
                <path d="M 175 75 C 170 45, 205 35, 225 50 C 245 65, 240 90, 215 95 Z" fill="#263238"/>
                <path d="M 225 50 C 240 35, 250 50, 235 70" fill="#ECEFF1"/>
                <path d="M 180 65 C 200 55, 220 55, 230 75" fill="none" stroke="#FFD54F" stroke-width="4"/>

                <path d="M 185 110 L 205 110 L 200 135 L 180 135 Z" fill="#263238"/>
                <path d="M 180 115 C 170 90, 180 70, 200 70 C 220 70, 230 85, 230 100 C 230 110, 220 120, 215 125 C 205 130, 190 125, 180 115 Z" fill="#263238"/>
                <path d="M 225 95 L 235 100 L 225 105 L 230 115 L 220 120" fill="#263238"/>
                <path d="M 210 95 Q 215 92 220 95 Q 215 98 210 95 Z" fill="#111"/>
                <circle cx="215" cy="95" r="1" fill="#fff"/>
                <path d="M 180 115 C 170 90, 180 70, 200 70 C 205 70, 210 72, 215 75 C 200 80, 185 95, 180 115 Z" fill="#111"/>
                <path d="M 175 80 C 150 90, 160 110, 180 100 Z" fill="#111"/>
            </g>
            
            <!-- Front Arm (Sword Arm) -->
            <g id="front_arm" transform="translate(185, 135) rotate(90) translate(-185, -135)">
                <path d="M 185 135 C 205 135, 215 165, 195 190 C 180 190, 165 165, 185 135 Z" fill="#263238"/>
                <path d="M 195 145 C 205 160, 200 175, 190 185" stroke="#3A2212" stroke-width="1.5" fill="none" opacity="0.6"/>
                <g id="front_lower" transform="translate(195, 185) rotate(40) translate(-195, -185)">
                    <path d="M 185 180 C 195 210, 230 220, 240 210 C 220 190, 205 180, 185 180 Z" fill="#263238"/>
                    <circle cx="235" cy="210" r="10" fill="#263238"/>
                    
                    <g id="sword" transform="translate(235, 210) rotate(-45)">
                        <!-- Handle -->
                        <rect x="-10" y="-8" width="130" height="16" fill="#212121" rx="5"/>
                        <!-- Guard -->
                        <circle cx="-10" cy="0" r="12" fill="#FFD54F"/>
                        <!-- Mace Head -->
                        <circle cx="120" cy="0" r="25" fill="#455A64"/>
                        <circle cx="120" cy="0" r="28" fill="none" stroke="#FFD54F" stroke-width="4"/>
                        <circle cx="120" cy="-25" r="5" fill="#FFD54F"/>
                        <circle cx="120" cy="25" r="5" fill="#FFD54F"/>
                        <circle cx="145" cy="0" r="5" fill="#FFD54F"/>
                        <circle cx="95" cy="0" r="5" fill="#FFD54F"/>
                        <!-- Spikes -->
                        <path d="M 148 0 L 165 0 M 120 -28 L 120 -45 M 120 28 L 120 45" stroke="#90A4AE" stroke-width="4" stroke-linecap="round"/>
                    </g>

                </g>
            </g>
        </g>

        <!-- Front Leg -->
        <g id="front_leg" transform="translate(175, 235) rotate(30) translate(-175, -235)">
            <path d="M 175 235 C 195 235, 205 270, 190 300 L 165 295 C 150 265, 160 245, 175 235 Z" fill="#F2F0E6"/>
            <path d="M 165 290 L 190 295 L 190 300 L 165 295 Z" fill="#FFD54F"/>
            <path d="M 175 240 C 185 260, 180 280, 175 295 M 185 245 C 195 265, 190 285, 185 295" stroke="#C4C1B3" stroke-width="2" fill="none"/>
            <g id="front_lower_leg" transform="translate(175, 295) rotate(0) translate(-175, -295)">
                <path d="M 175 295 C 195 320, 185 350, 175 370 C 160 370, 155 340, 165 310 Z" fill="#263238"/>
                <path d="M 175 305 C 185 320, 185 340, 175 360" stroke="#3A2212" stroke-width="2" fill="none" opacity="0.5"/>
                <path d="M 170 365 C 195 365, 205 375, 200 385 L 160 385 C 155 375, 160 365, 170 365 Z" fill="#263238"/>
            </g>
        </g>
        
    </g>
</svg>